<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f7f9;color:#1b2730;font-family:Arial,sans-serif;line-height:1.5">
  <main style="max-width:560px;margin:0 auto;padding:24px;background:#fff;border:1px solid #dce4e9;border-radius:8px">
    <p style="margin:0 0 16px;color:#145a83;font-weight:700">{{ school_name }}</p>
    <h1 style="margin:0 0 12px;font-size:22px">{{ title }}</h1>
    <p style="margin:0 0 24px">{{ message }}</p>
    {% if action_url %}<p style="margin:0"><a href="{{ action_url }}" style="display:inline-block;padding:11px 16px;border-radius:6px;background:#145a83;color:#fff;text-decoration:none">View appointment</a></p>{% endif %}
    <p style="margin:24px 0 0;color:#56636d;font-size:13px">This is an appointment service message. You can change appointment email preferences in your profile.</p>
  </main>
</body>
</html>
