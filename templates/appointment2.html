{% extends "app_shell.html" %}
{% block title %}Pick Your Slot{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">
{% endblock %}
{% block page_styles %}
<style>
        .time-grid button.unavailable {
            background-color: rgb(242, 67, 67);
            cursor: not-allowed;
            color: black;
        }
        .time-grid button.selected {
            background-color: rgb(89, 245, 89);
        }

        .submit button {
            position: relative;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            padding-block: 0.5rem;
            padding-inline: 1.25rem;
            background-color: rgb(0 107 179);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffff;
            gap: 10px;
            font-weight: bold;
            border: 3px solid #ffffff4d;
            outline: none;
            overflow: hidden;
            font-size: 15px;
        }

        .submit icon {
            width: 24px;
            height: 24px;
            transition: all 0.3s ease-in-out;
        }

        .submit button:hover {
            transform: scale(1.05);
            border-color: #fff9;
        }

        .button:hover .icon {
            transform: translate(4px);
        }

        .submit button:hover::before {
            animation: shine 1.5s ease-out infinite;
        }

        .submit button::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100%;
            background-image: linear-gradient(
                120deg,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0.8),
                rgba(255, 255, 255, 0) 70%
            );
            top: 0;
            left: -100px;
            opacity: 0.6;
        }

        @keyframes shine {
            0% {
                left: -100px;
            }

            60% {
                left: 100%;
            }

            to {
                left: 100%;
            }
        }
    </style>
{% endblock %}
{% block content %}
<form id="appointment-form" method="post" action="/create_booking">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="appointmentwrapper">
            <div class="appointment-header">
                <div class="contactinfo">
                    <label>Choose Your Lecturer</label>
                    <select name="lecturer" class="bordered-select" style="margin-left: 20px;">
                        {% for lecturer in lecturers %}
                            <option value="{{ lecturer['id'] }}">{{ lecturer['username'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="contactinfo">
                    <label>Purpose of Appointment</label>
                    <input type="text" placeholder="Enter your appointment purpose" name="purpose" required style="width: 300px; margin-left: 20px;">         
                </div>                
            </div>
            <div class="datepicker">
                <label>Select Date</label>
                <input type="date" id="appointment-date" name="appointment_date" required>
                <div id="time-slots" class="time-grid">
                </div>                    
            </div>
        </div>   
        <div class="submit" style="display: flex; justify-content: center;">
            <button class="button" type="submit">
                Apply Now
                <svg fill="currentColor" viewBox="0 0 24 24" class="icon">
                  <path clip-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z" fill-rule="evenodd"></path>
                </svg>
              </button>
        </div>
    </form>
{% endblock %}
{% block scripts %}
<script>
        function updateAvailability() {
            const appointmentDate = $("#appointment-date").val();
            const lecturer = $("select[name='lecturer']").val();
            const container = $("#time-slots").empty();
            $("#appointment-form input[name='availability_id'], #appointment-form input[name='slot_start']").remove();
            if (!appointmentDate || !lecturer) return;

            $.getJSON("/get_calendar_details", {
                lecturer: lecturer,
                appointment_date: appointmentDate
            }).done(function(response) {
                if (!response.slots.length) {
                    container.text("No consultation slots are available for this date.");
                    return;
                }
                response.slots.forEach(function(slot) {
                    const button = $("<button>", {type: "button", text: slot.label})
                        .addClass("time-slot")
                        .toggleClass("unavailable", !slot.available)
                        .prop("disabled", !slot.available)
                        .data("availability-id", slot.availability_id)
                        .data("starts-at", slot.starts_at);
                    container.append(button);
                });
            }).fail(function() {
                container.text("Unable to load consultation slots.");
            });
        }

        $("#appointment-date, select[name='lecturer']").on("change", updateAvailability);

        $("#time-slots").on("click", ".time-slot", function() {
            $("#time-slots .time-slot").removeClass("selected");
            $(this).addClass("selected");
            $("#appointment-form input[name='availability_id'], #appointment-form input[name='slot_start']").remove();
            $("#appointment-form").append(
                $("<input>", {type: "hidden", name: "availability_id", value: $(this).data("availability-id")}),
                $("<input>", {type: "hidden", name: "slot_start", value: $(this).data("starts-at")})
            );
        });

        $("#appointment-form").on("submit", function(event) {
            if (!$("#appointment-form input[name='slot_start']").val()) {
                event.preventDefault();
                alert("Please select a time slot.");
            }
        });
    </script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
{% endblock %}
