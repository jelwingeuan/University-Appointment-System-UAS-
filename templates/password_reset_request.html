{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="wrapper">
        <h1>Reset password</h1>
        <p>Enter your university email address. If the account can receive mail, we will send instructions.</p>
        <form action="{{ url_for('auth.password_reset_request') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <button type="submit">Send instructions</button>
        </form>
        <a href="{{ url_for('auth.login') }}">Return to sign in</a>
    </section>
{% endblock %}
