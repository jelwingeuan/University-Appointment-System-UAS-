{% macro render_breadcrumbs(items) %}
<nav class="app-breadcrumbs" aria-label="Breadcrumb">
    <ol>
        {% for item in items %}
        <li>
            {% if item.url %}<a href="{{ item.url }}">{{ item.label }}</a>
            {% else %}<span aria-current="page">{{ item.label }}</span>{% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
{% endmacro %}
